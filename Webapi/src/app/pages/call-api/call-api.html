<div style="margin-bottom: 20px">
  <div
    style="
      display: flex;
      justify-content: flex-end;
      padding-right: 100px;
      margin-bottom: 15px;
    "
  >
  <mat-form-field appearance="outline" class="w-100">
    <mat-label>ค้นหาทริปตาม ID</mat-label>
    <input
      matInput
      placeholder="กรอก ID..."
      [(ngModel)]="tripId"
      (keyup.enter)="searchById()" />
  </mat-form-field>


  <mat-form-field appearance="outline" class="w-100">
    <mat-label>ค้นหาตามชื่อ</mat-label>
    <input
      matInput
      placeholder="กรอกชื่อทริป..."
      [(ngModel)]="searchname"
      (keyup.enter)="searchName()" />
  </mat-form-field>

  <!-- ปุ่มค้นหา -->

    <div class="form-group">
                <mat-form-field appearance="outline" class="search-field">
                  <mat-label>เลือกประเทศ</mat-label>
                  <mat-select name="country" [(ngModel)]="searchcountry"(selectionChange)="searchCountry()">
                    <mat-option
                      *ngFor="let country of country"
                      [value]="country"
                    >
                      {{ country }}
                    </mat-option>
                  </mat-select>
                  <mat-icon matSuffix>public</mat-icon>
                </mat-form-field>
              </div>
  </div>
  <div
    style="
      display: flex;
      justify-content: flex-end;
      padding-right: 100px;
      gap: 10px;
    "
  >
  <button mat-raised-button color="primary" (click)="searchById()">
    ค้นหาด้วยid
  </button>
  <button mat-raised-button color="primary" (click)="searchName()">
    ค้นหาด้วยชื่อ
  </button>
  <button mat-raised-button color="primary" (click)="goToCreate()">เพิ่มข้อมูลใหม่</button>

    <button mat-stroked-button color="warn" (click)="getTrip()">
      ♻️ รีเซ็ต
    </button>
  </div>
</div>
<div class="p-4">
  <!-- แสดง list ของ trips -->
  <div *ngIf="trips && trips.length > 0; else noData">
    <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
      <mat-card *ngFor="let t of trips">
        <!-- รูปภาพ -->
        <img mat-card-image [src]="t.coverimage" alt="ภาพสถานที่" />

        <!-- ชื่อ -->
        <mat-card-title>{{ t.name }}</mat-card-title>
        <!-- รายละเอียดสั้น -->
        <mat-card-content>
          <p><b>id:</b> {{ t.idx }}</p>
          <p><b>ราคา:</b> {{ t.price | number }} บาท</p>
          <p><b>ประเทศ:</b> {{ t.country }}</p>
          <p><b>ระยะเวลา:</b> {{ t.duration }} วัน</p>
          <p><b>ทวีป:</b> {{ t.destination_zone }}</p>
          <!-- <p><b>รายละเอียด:</b> {{ t.detail }}</p> -->
        </mat-card-content>
        <button (click)="goToDetail(t.idx)">ดูรายละเอียด</button>
      </mat-card>
    </div>
  </div>
  <!-- ถ้าไม่มี trips -->
  <ng-template #noData>
    <p>❌ ไม่มีข้อมูลสถานที่</p>
  </ng-template>
</div>
