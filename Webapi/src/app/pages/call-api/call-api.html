<div style="margin-bottom: 20px">
  <div
    style="
      display: flex;
      justify-content: flex-end;
      padding-right: 100px;
      margin-bottom: 15px;
    "
  >
    <button mat-raised-button color="primary" (click)="goToCreate()">
      เพิ่มข้อมูลใหม่
    </button>
  </div>

  <div
    style="
      display: flex;
      justify-content: flex-end;
      padding-right: 100px;
      margin-bottom: 15px;
    "
  >
    <mat-form-field
      appearance="outline"
      class="flex-1"
      style="margin-right: 10px"
    >
      <mat-label>ค้นหาประเทศ</mat-label>
      <input
        matInput
        [(ngModel)]="country"
        placeholder="กรอกชื่อประเทศ เช่น ญี่ปุ่น"
      />
    </mat-form-field>
  </div>
  <div
    style="
      display: flex;
      justify-content: flex-end;
      padding-right: 100px;
      gap: 10px;
    "
  >
    <button mat-raised-button color="accent" (click)="searchCountry(country)">
      🔍 ค้นหาประเทศ
    </button>
    <button mat-stroked-button color="warn" (click)="getTrip()">
      ♻️ รีเซ็ต
    </button>
  </div>
</div>
<div class="p-4">
  <!-- แสดง list ของ trips -->
  <div *ngIf="trips && trips.length > 0; else noData">
    <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
      <mat-card *ngFor="let t of trips">
        <!-- รูปภาพ -->
        <img mat-card-image [src]="t.coverimage" alt="ภาพสถานที่" />

        <!-- ชื่อ -->
        <mat-card-title>{{ t.name }}</mat-card-title>
        <!-- รายละเอียดสั้น -->
        <mat-card-content>
          <p><b>id:</b> {{ t.idx }}</p>
          <p><b>ราคา:</b> {{ t.price | number }} บาท</p>
          <p><b>ประเทศ:</b> {{ t.country }}</p>
          <p><b>ระยะเวลา:</b> {{ t.duration }} วัน</p>
          <p><b>ทวีป:</b> {{ t.destination_zone }}</p>
          <!-- <p><b>รายละเอียด:</b> {{ t.detail }}</p> -->
        </mat-card-content>
        <button (click)="goToDetail(t.idx)">ดูรายละเอียด</button>
      </mat-card>
    </div>
  </div>
  <!-- ถ้าไม่มี trips -->
  <ng-template #noData>
    <p>❌ ไม่มีข้อมูลสถานที่</p>
  </ng-template>
</div>
