<div class="form-container">
  <mat-form-field appearance="outline">
    <mat-label>Name</mat-label>
    <input matInput [(ngModel)]="trip.name" name="name" />
  </mat-form-field>

  <mat-form-field appearance="outline">
    <mat-label>Country</mat-label>
    <input matInput [(ngModel)]="trip.country" name="country" />
  </mat-form-field>

  <mat-form-field appearance="outline">
    <mat-label>Destination ID</mat-label>
    <input matInput type="number" [(ngModel)]="trip.destinationid" name="destinationid" />
  </mat-form-field>



  <mat-form-field appearance="outline">
    <mat-label>Detail</mat-label>
    <textarea matInput [(ngModel)]="trip.detail" name="detail"></textarea>
  </mat-form-field>

  <mat-form-field appearance="outline">
    <mat-label>Price</mat-label>
    <input matInput type="number" [(ngModel)]="trip.price" name="price" />
  </mat-form-field>

  <mat-form-field appearance="outline">
    <mat-label>Duration</mat-label>
    <input matInput type="number" [(ngModel)]="trip.duration" name="duration" />
  </mat-form-field>

  <button mat-raised-button color="primary" (click)="insertTrip()">Insert Trip</button>
</div>
